# Multi-document YAML (a single file with more than one `---`-separated
# resource) is a common kubectl-apply bundling pattern: a StepAction and a
# Task that uses it (via `ref:`), bundled together. See the
# "multi-document YAML" test in check.js.
apiVersion: tekton.dev/v1
kind: StepAction
metadata:
  name: shared-lint1
spec:
  image: alpine
  script: |
    #!/usr/bin/env sh
    echo "linting..."
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build
spec:
  steps:
    - name: lint
      ref:
        name: shared-lint1
    - name: compile
      image: golang
      script: go build ./...
