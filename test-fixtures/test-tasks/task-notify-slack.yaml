apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: notify-slack
spec:
  description: Posts a build notification to Slack.
  params:
    - name: channel
      type: string
      description: Slack channel to notify.
      default: "#ci"
    - name: message
      type: string
      description: Message text to post.
    - name: fields
      type: object
      description: Extra key/value fields to attach to the message.
      default: {}
      properties:
        status:
          type: string
        build-url:
          type: string
  steps:
    - name: notify
      image: curlimages/curl
      script: |
        #!/bin/sh
        set -e
        echo "posting to $(params.channel): $(params.message)"
