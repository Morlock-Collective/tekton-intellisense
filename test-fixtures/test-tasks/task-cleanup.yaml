apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  description: Removes build artifacts older than a configured number of days.
  params:
    - name: retain-days
      type: string
      description: Artifacts older than this many days are removed.
      default: "7"
  steps:
    - name: cleanup
      image: alpine
      script: |
        #!/usr/bin/env sh
        set -e
        echo "cleaning up artifacts older than $(params.retain-days) days"
